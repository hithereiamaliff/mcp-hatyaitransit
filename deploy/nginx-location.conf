# Nginx location block for the Hat Yai Transit MCP Server
#
# Add this INSIDE the existing `server { listen 443 ssl ...; server_name mcp.techmavie.digital; }`
# block on the VPS:
#   sudo nano /etc/nginx/sites-available/mcp.techmavie.digital
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public URLs:
#   https://mcp.techmavie.digital/hatyaitransit/mcp        (MCP endpoint, POST)
#   https://mcp.techmavie.digital/hatyaitransit/health
#   https://mcp.techmavie.digital/hatyaitransit/analytics
#
# CORS headers are added by the app itself. Do NOT add them here as well, or browsers will
# see duplicate Access-Control-Allow-Origin headers and refuse the response.

# Bare path without the trailing slash → add it
location = /hatyaitransit {
    return 301 /hatyaitransit/;
}

location /hatyaitransit/ {
    # Trailing slash strips the /hatyaitransit prefix before proxying to the container
    proxy_pass http://127.0.0.1:8095/;

    # Required headers for the Streamable HTTP transport
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Stream responses straight through
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # For potential WebSocket upgrade (future compatibility, same as the other MCP servers)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
